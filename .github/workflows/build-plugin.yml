name: Build VST3 (Windows)
on:
  push:
    paths: ['plugin/**', 'device/**', 'installer/**', '.github/workflows/build-plugin.yml']
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S plugin -B plugin/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build plugin/build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: LiveDiscordSend-vst3-windows
          path: plugin/build/LiveDiscordSend_artefacts/Release/VST3/
  device:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S device -B device/build
      - name: Build
        run: cmake --build device/build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: ldsc-device-windows
          path: |
            device/build/Release/ldsc-device.exe
            device/build/Release/ldsc-tray.exe
  installer:
    needs: [windows, device]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: ldsc-device-windows, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: LiveDiscordSend-vst3-windows, path: dist/vst3 }
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          Get-ChildItem dist -Recurse | Select-Object -ExpandProperty FullName
          & $iscc installer\ldsc.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: LiveDiscordSend-Setup
          path: dist/LiveDiscordSend-Setup.exe
